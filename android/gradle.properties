org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Run the Kotlin compiler in a dedicated out-of-process daemon to avoid the
# "Could not close incremental caches" failure seen with in-process execution
# under AGP 9 / Kotlin 2.3 on Windows.
kotlin.compiler.execution.strategy=daemon
# Disable the Kotlin Build Tools API compiler runner: under AGP 9 / Kotlin 2.3
# on Windows it fails to close the incremental caches for the android_file_picker
# module ("Could not close incremental caches"). The legacy compiler runner works.
kotlin.compiler.runViaBuildToolsApi=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
