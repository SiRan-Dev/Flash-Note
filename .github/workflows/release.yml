name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Android (signed APK + AAB)
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/flashnote-release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=flashnote-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # ---------------------------------------------------------------------------
  # iOS (no codesign)
  # ---------------------------------------------------------------------------
  # NOTE: iOS build runs without code signing (--no-codesign), which cannot
  # produce a deployable IPA without an Apple Development Team. We mark it
  # continue-on-error so it never blocks the other platforms' release. The
  # publish step below tolerates a missing iOS artifact.
  ios:
    name: iOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r ../../../../FlashNote-ios.ipa Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: FlashNote-ios.ipa

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS
        run: flutter build macos --release

      - name: Package DMG-less zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../FlashNote-macos.zip FlashNote.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: FlashNote-macos.zip

  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release/

  # ---------------------------------------------------------------------------
  # Linux
  # ---------------------------------------------------------------------------
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Package zip
        run: |
          cd build/linux/x64/release
          zip -r ../../../../FlashNote-linux.zip bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: FlashNote-linux.zip

  # ---------------------------------------------------------------------------
  # Publish GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Release
    needs: [android, ios, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/android/app-release.apk release/FlashNote-android.apk
          cp artifacts/android/app-release.aab release/FlashNote-android.aab
          # iOS artifact is optional: the job runs with continue-on-error and
          # may not produce an IPA when no signing team is configured.
          if [ -f artifacts/ios/FlashNote-ios.ipa ]; then
            cp artifacts/ios/FlashNote-ios.ipa release/FlashNote-ios.ipa
          fi
          cp artifacts/macos/FlashNote-macos.zip release/FlashNote-macos.zip
          cp artifacts/linux/FlashNote-linux.zip release/FlashNote-linux.zip
          cd artifacts/windows
          zip -r ../../release/FlashNote-windows.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
